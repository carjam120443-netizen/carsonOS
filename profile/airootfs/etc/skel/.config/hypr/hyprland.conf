# CarsonOS starter configuration for Hyprland.
# Install with the desktop shortcut or run: carsonos-hyprland

$mainMod = SUPER
$terminal = kitty
$fileManager = thunar
$menu = wofi --show drun

monitor = ,preferred,auto,1
exec-once = waybar
exec-once = /usr/lib/polkit-kde-authentication-agent-1

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(33cc88ff)
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 8
}

input {
    kb_layout = us
}

bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, D, exec, $menu
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, M, exit
bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreen
