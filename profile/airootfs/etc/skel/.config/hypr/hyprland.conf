# CarsonOS Hyprland — original CarsonOS wallpaper, emerald/ice-blue accents.
# Main reference: Super. Waybar is intentionally pinned to the bottom.

$mainMod = SUPER
$terminal = kitty
$fileManager = thunar
$menu = wofi --show drun

monitor = ,preferred,auto,1
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = GDK_BACKEND,wayland,x11
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

exec-once = hyprpaper
exec-once = waybar
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = nm-applet --indicator

general {
    gaps_in = 5
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(4cff91ff) rgba(35b8ffff) 45deg
    col.inactive_border = rgba(536779aa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 12
    active_opacity = 0.97
    inactive_opacity = 0.92

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(02070ddd)
    }

    blur {
        enabled = true
        size = 7
        passes = 3
        new_optimizations = true
        xray = false
    }
}

animations {
    enabled = true
    bezier = carsonEase, 0.22, 1, 0.36, 1
    animation = windows, 1, 5, carsonEase, popin 80%
    animation = windowsOut, 1, 4, carsonEase, popin 80%
    animation = border, 1, 7, carsonEase
    animation = fade, 1, 5, carsonEase
    animation = workspaces, 1, 5, carsonEase, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true
}

# Window rules keep dialogs and utility windows feeling desktop-friendly.
windowrulev2 = float,class:^(org.pulseaudio.pavucontrol)$
windowrulev2 = size 900 620,class:^(org.pulseaudio.pavucontrol)$
windowrulev2 = float,title:^(CarsonOS Quick Settings)$
windowrulev2 = center,title:^(CarsonOS Quick Settings)$

# Apps
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, D, exec, $menu
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, M, exit
bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreen
bind = $mainMod, R, exec, wofi --show drun
bind = $mainMod, P, pseudo
bind = $mainMod, S, exec, grim -g "$(slurp)" - | wl-copy
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Focus/move/resize windows with Super + H/J/K/L.
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Numbered workspaces and moving windows between them.
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
