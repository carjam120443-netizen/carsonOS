# CarsonOS lock screen — matching the emerald and ice-blue desktop theme.
general {
    hide_cursor = true
    grace = 2
    no_fade_in = false
}

background {
    monitor =
    color = rgba(7, 17, 29, 1.0)
}

label {
    monitor =
    text = cmd[update:1000] date +"%I:%M %p"
    color = rgba(230, 244, 241, 1.0)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgba(145, 169, 184, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 45
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 58
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba(76, 255, 145, 1.0)
    inner_color = rgba(16, 29, 42, 1.0)
    font_color = rgba(230, 244, 241, 1.0)
    fade_on_empty = false
    placeholder_text = <i>Enter password</i>
    rounding = 14
    position = 0, -40
    halign = center
    valign = center
}
