# CarsonOS lock screen — emerald and ice-blue accents.
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    grace = 2
}

background {
    monitor =
    path = /usr/share/backgrounds/carsonos/default.png
    blur_passes = 3
    blur_size = 8
}

input-field {
    monitor =
    size = 320, 58
    outline_thickness = 2
    inner_color = rgba(16, 29, 42, 0.94)
    outer_color = rgba(76, 255, 145, 1.0) rgba(53, 184, 255, 1.0) 45deg
    check_color = rgba(76, 255, 145, 1.0)
    fail_color = rgba(255, 107, 129, 1.0)
    font_color = rgba(230, 244, 241, 1.0)
    fade_on_empty = false
    rounding = 14
    font_family = $font
    placeholder_text = <i>Enter password to unlock</i>
    fail_text = <i>Authentication failed</i>
    dots_spacing = 0.3
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(230, 244, 241, 1.0)
    font_size = 72
    font_family = $font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgba(145, 169, 184, 1.0)
    font_size = 18
    font_family = $font
    position = 0, 45
    halign = center
    valign = center
}
