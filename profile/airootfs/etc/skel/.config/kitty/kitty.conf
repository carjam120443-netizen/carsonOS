# CarsonOS terminal — matching the emerald/ice-blue system theme.
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
font_size 11.0
background #07111d
foreground #e6f4f1
selection_background #284553
selection_foreground #ffffff
cursor #4cff91
cursor_shape beam
cursor_blink_interval 0.5
window_padding_width 12
confirm_os_window_close 0
enable_audio_bell no
remember_window_size yes
initial_window_width 1100
initial_window_height 680

color0  #101d2a
color1  #ff6b81
color2  #4cff91
color3  #ffd166
color4  #35b8ff
color5  #c792ea
color6  #70e1e8
color7  #d7e2ea
color8  #536779
color9  #ff8294
color10 #6dffab
color11 #ffe08a
color12 #69c7ff
color13 #d8aaff
color14 #8cebf0
color15 #f1f7fb
