# CarsonOS Calamares configuration.
# Experimental: validate the full installation flow in a disposable VM.
modules-search:
  - local
  - /usr/lib/calamares/modules

instances:
  - id: welcome
    module: welcome
  - id: locale
    module: locale
  - id: keyboard
    module: keyboard
  - id: partition
    module: partition
  - id: users
    module: users
  - id: summary
    module: summary

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - bootloader
      - packages
      - services
      - finished

branding: carsonos
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
