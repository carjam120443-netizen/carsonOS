LABEL carsonos
TEXT HELP
Boot the CarsonOS live desktop.
Use this environment to try CarsonOS or start the installer.
ENDTEXT
MENU LABEL CarsonOS Live Desktop (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
