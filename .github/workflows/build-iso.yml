name: Build CarsonOS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "profile/**"
      - "scripts/build-iso.sh"
      - ".github/workflows/build-iso.yml"
  pull_request:
    paths:
      - "profile/**"
      - "scripts/build-iso.sh"
      - ".github/workflows/build-iso.yml"

# Only spend runner time on the newest ISO build for this branch.
concurrency:
  group: carsonos-iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-iso:
    name: Build Archiso live image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out CarsonOS
        uses: actions/checkout@v4

      - name: Build ISO inside Arch Linux
        shell: bash
        run: |
          set -euo pipefail
          docker pull archlinux:latest
          docker run --rm --privileged \
            --volume "${GITHUB_WORKSPACE}:/work" \
            --workdir /work \
            archlinux:latest \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm
              pacman -S --needed --noconfirm archiso git pacman-contrib
              # Verify the key-management command exists before bootstrapping Chaotic-AUR.
              command -v pacman-key
              # Bootstrap Chaotic-AUR in the build container so archiso can
              # resolve yay and the repository support packages from the profile.
              # The disposable Arch container may not have a pacman keyring yet.
              # Initialize it before importing and locally trusting Chaotic-AUR's key.
              pacman-key --init
              pacman-key --populate archlinux
              pacman-key --recv-key 3056513887B78AEB --keyserver keyserver.ubuntu.com
              pacman-key --lsign-key 3056513887B78AEB
              pacman -U --noconfirm \
                https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-keyring.pkg.tar.zst \
                https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-mirrorlist.pkg.tar.zst
              bash scripts/build-iso.sh
            '

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: carsonos-live-iso
          path: out/*.iso
          if-no-files-found: error
          retention-days: 14
