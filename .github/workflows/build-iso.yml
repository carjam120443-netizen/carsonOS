name: Build CarsonOS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "profile/**"
      - "scripts/build-iso.sh"
      - ".github/workflows/build-iso.yml"
  pull_request:
    paths:
      - "profile/**"
      - "scripts/build-iso.sh"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

jobs:
  build-iso:
    name: Build Archiso live image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out CarsonOS
        uses: actions/checkout@v4

      - name: Build ISO inside Arch Linux
        shell: bash
        run: |
          set -euo pipefail
          docker pull archlinux:latest
          docker run --rm --privileged \
            --volume "${GITHUB_WORKSPACE}:/work" \
            --workdir /work \
            archlinux:latest \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm
              pacman -S --needed --noconfirm archiso git
              bash scripts/build-iso.sh
            '

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: carsonos-live-iso
          path: out/*.iso
          if-no-files-found: error
          retention-days: 14
